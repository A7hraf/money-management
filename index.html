  <button class="addbtn" data-act="add" aria-label="Add"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>

<dialog id="askDlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<div id="done" hidden></div>
<div id="story" hidden></div>
<input type="file" id="smsFile" accept=".txt,text/plain" hidden>
